# One port (8080) for both apps: eurofish at /, ihatepdf at /ihatepdf/.
# Move eurofish to another internal port (e.g. 127.0.0.1:8082), run ihatepdf
# with IHATEPDF_BASE_PATH=/ihatepdf (it keeps listening on :8081 internally),
# and let nginx own port 8080.
server {
  listen 8080;
  client_max_body_size 64m;     # keep >= IHATEPDF_MAX_FILE_MB
  client_body_timeout 120s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # ihatepdf: the prefix is passed through unchanged (no trailing slash on proxy_pass).
  location /ihatepdf {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  # everything else: eurofish
  location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
