# Round-robin load balancer for the ihatepdf replicas (compose.scale.yaml).
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's DNS returns one A record per replica; nginx balances across them.
  upstream ihatepdf {
    server ihatepdf:8081;
    keepalive 32;
  }

  server {
    listen 80;
    # PDFs saved to "My files" (keep >= IHATEPDF_MAX_FILE_MB).
    client_max_body_size 64m;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
      proxy_pass http://ihatepdf;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
    }
  }
}
